name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    # No container, deliberately.
    #
    # This used to run in wpilib/roborio-cross-ubuntu, and that image is the source of a long-running
    # CI outage worth recording so nobody restores it without knowing:
    #
    #   1. The tag has to track the season, so it silently rots every January. It sat on 2024-22.04
    #      while the project moved to 2026.
    #   2. Fixing that by analogy gives `2026-22.04`, which does not exist -- WPILib changed the 2026
    #      tagging to require a Python suffix (py313/py314). Every build then died pulling the image,
    #      before checkout, with "manifest unknown": no compiler output, no test results, nothing
    #      pointing at any file.
    #   3. With the real tag, the pull succeeds and the build fails anyway, because that image does not
    #      put a JDK on PATH or set JAVA_HOME.
    #
    # The container exists for cross-compiling and deploying to a roboRIO. This job only builds and
    # tests a pure-Java project, which needs a JDK and the Gradle wrapper and nothing else -- verified
    # by running the same `./gradlew build` outside any container. So the container buys nothing here
    # and costs a yearly breakage.
    steps:
      # v4, not v2. v2 runs on a Node release GitHub has retired, so it warns now and will fail later.
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 to match build.gradle's source/targetCompatibility. Explicit rather than inherited, so
      # a change to the runner image cannot quietly move the compiler out from under the project.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build robot code
        run: ./gradlew build
